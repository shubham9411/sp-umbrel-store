version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: my-store-coolify_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  coolify-permissions:
    image: ghcr.io/coollabsio/coolify:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p \
          /data/coolify/source \
          /data/coolify/ssh/keys \
          /data/coolify/ssh/mux \
          /data/coolify/applications \
          /data/coolify/databases \
          /data/coolify/services \
          /data/coolify/backups \
          /data/coolify/proxy/dynamic \
          /data/coolify/webhooks-during-maintenance \
          /data/coolify/sentinel
        chown -R 9999:root /data/coolify
        chmod 700 /data/coolify
    volumes:
      - ${APP_DATA_DIR}/data/coolify:/data/coolify

  coolify-db:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: coolify
      POSTGRES_PASSWORD: ${APP_COOLIFY_DB_PASSWORD}
      POSTGRES_DB: coolify
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  coolify-redis:
    image: redis:7-alpine
    restart: on-failure
    environment:
      REDIS_PASSWORD: ${APP_COOLIFY_REDIS_PASSWORD}
    command:
      - redis-server
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${APP_COOLIFY_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    image: ghcr.io/coollabsio/coolify:latest
    restart: on-failure
    environment:
      APP_ID: ${APP_COOLIFY_APP_ID}
      APP_NAME: Coolify
      APP_ENV: production
      APP_KEY: ${APP_COOLIFY_APP_KEY}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: coolify-db
      DB_PORT: 5432
      DB_DATABASE: coolify
      DB_USERNAME: coolify
      DB_PASSWORD: ${APP_COOLIFY_DB_PASSWORD}
      REDIS_HOST: coolify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${APP_COOLIFY_REDIS_PASSWORD}
      AUTOUPDATE: "false"
      SELF_HOSTED: "true"
      SSL_MODE: "off"
      BASE_CONFIG_PATH: /data/coolify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data/coolify:/data/coolify
      - ${APP_DATA_DIR}/data/coolify/ssh:/var/www/html/storage/app/ssh
      - ${APP_DATA_DIR}/data/coolify/applications:/var/www/html/storage/app/applications
      - ${APP_DATA_DIR}/data/coolify/databases:/var/www/html/storage/app/databases
      - ${APP_DATA_DIR}/data/coolify/services:/var/www/html/storage/app/services
      - ${APP_DATA_DIR}/data/coolify/backups:/var/www/html/storage/app/backups
      - ${APP_DATA_DIR}/data/coolify/webhooks-during-maintenance:/var/www/html/storage/app/webhooks-during-maintenance
    depends_on:
      coolify-permissions:
        condition: service_completed_successfully
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
