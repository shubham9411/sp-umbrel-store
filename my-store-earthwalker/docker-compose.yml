version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: my-store-earthwalker_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    build:
      context: https://gitlab.com/glatteis/earthwalker.git
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/badger:/opt/earthwalker/badger
