version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: my-store-earthwalker_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: registry.gitlab.com/glatteis/earthwalker:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/badger:/opt/earthwalker/badger
