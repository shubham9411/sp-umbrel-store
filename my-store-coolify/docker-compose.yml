version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: my-store-coolify_web_1
      APP_PORT: 8000

  web:
    image: ghcr.io/coollabsio/coolify:latest
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data/coolify:/data/coolify
    environment:
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/data/coolify/db.sqlite
